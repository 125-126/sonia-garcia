<head>
<meta charset="UTF-8">

<title>Listado de tarjetas - La Reina</title>

<style>
:root {
    --azul-oscuro: #0f172a;
    --azul: #1d4ed8;
    --fondo: #f1f5f9;
    --borde: #e2e8f0;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 24px;
    font-family: Arial, sans-serif;
    background: var(--fondo);
    color: #1e293b;
}

.contenedor {
    max-width: 1600px;
    margin: auto;
    background: white;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 4px 15px #0000000d;
}

.encabezado {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    margin-bottom: 22px;
}

h1 {
    margin: 0;
    color: var(--azul-oscuro);
    font-size: 25px;
}

.subtitulo {
    margin-top: 7px;
    color: #64748b;
}

.controles {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

input, select, button {
    padding: 11px 13px;
    border: 1px solid var(--borde);
    border-radius: 7px;
    font-size: 14px;
}

#buscar {
    flex: 1;
    min-width: 240px;
}

button {
    cursor: pointer;
    background: var(--azul);
    color: white;
    border: none;
    font-weight: bold;
}

button:hover {
    opacity: .88;
}

.limpiar {
    background: #64748b;
}

.resumen {
    margin-bottom: 15px;
    font-size: 14px;
    color: #475569;
}

.tabla-contenedor {
    overflow-x: auto;
    border: 1px solid var(--borde);
    border-radius: 8px;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 950px;
}

thead {
    background: var(--azul-oscuro);
    color: white;
}

th, td {
    padding: 12px 10px;
    text-align: left;
    border-bottom: 1px solid var(--borde);
    font-size: 13px;
}

th {
    white-space: nowrap;
}

tbody tr:nth-child(even) {
    background: #f8fafc;
}

tbody tr:hover {
    background: #eff6ff;
}

td:first-child {
    font-weight: bold;
    color: var(--azul);
}

@media print {
    body {
        padding: 0;
        background: white;
    }

    .contenedor {
        padding: 0;
        box-shadow: none;
    }

    .controles, .no-imprimir {
        display: none !important;
    }

    .tabla-contenedor {
        overflow: visible;
        border: none;
    }

    table {
        min-width: 0;
    }

    th, td {
        padding: 5px;
        font-size: 9px;
    }

    thead {
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
    }
}
</style>
</head>

const clientes = datos.trim().split("\n").map(linea => {
    const [tarjeta, cliente, telefono, direccion, abono] = linea.split("|");
    return {
        tarjeta: tarjeta || "",
        cliente: cliente || "",
        telefono: telefono || "",
        direccion: direccion || "",
        abono: abono || ""
    };
});

function escapar(valor) {
    return String(valor).replace(/[&<>"']/g, caracter => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[caracter]);
}

function filtrar() {
    const busqueda = document.getElementById("buscar").value
        .trim().toLocaleLowerCase("es");
    const filtro = document.getElementById("filtroAbono").value;

    const resultado = clientes.filter(c => {
        const texto = [
            c.tarjeta, c.cliente, c.telefono, c.direccion, c.abono
        ].join(" ").toLocaleLowerCase("es");

        let coincideTexto = texto.includes(busqueda);
        let anio = c.abono.match(/(\d{4})$/);
        let coincideAnio = true;

        if (filtro === "sin-fecha") {
            coincideAnio = !c.abono;
        } else if (filtro === "anteriores") {
            coincideAnio = anio && Number(anio[1]) < 2024;
        } else if (filtro) {
            coincideAnio = anio && anio[1] === filtro;
        }

        return coincideTexto && coincideAnio;
    });

    document.getElementById("tablaClientes").innerHTML =
        resultado.map(c => `
            <tr>
                <td>${escapar(c.tarjeta)}</td>
                <td>${escapar(c.cliente)}</td>
                <td>${escapar(c.telefono)}</td>
                <td>${escapar(c.direccion)}</td>
                <td>${escapar(c.abono)}</td>
            </tr>
        `).join("");

    document.getElementById("resumen").textContent =
        `Mostrando ${resultado.length} de ${clientes.length} tarjetas`;
}

function limpiarFiltros() {
    document.getElementById("buscar").value = "";
    document.getElementById("filtroAbono").value = "";
    filtrar();
}

filtrar();
</script>
